apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trino.fullname" . }}-worker
  labels:
    {{- include "trino.labels" . | nindent 4 }}
    component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "trino.labels" . | nindent 6 }}
      component: worker
  template:
    metadata:
      labels:
        {{- include "trino.labels" . | nindent 8 }}
        component: worker
    spec:
      containers:
        - name: trino
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/trino/jvm.config
              subPath: jvm-worker.config
            - name: config
              mountPath: /etc/trino/config.properties
              subPath: config-worker.properties
            - name: config
              mountPath: /etc/trino/node.properties
              subPath: node.properties
            - name: config
              mountPath: /etc/trino/catalog/tpch.properties
              subPath: tpch.properties
            - name: config
              mountPath: /etc/trino/catalog/iceberg.properties
              subPath: iceberg.properties
          readinessProbe:
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: {{ include "trino.fullname" . }}-config
